<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="6"/>

  <!-- Kanban / Checklists Columns -->
  <!-- Column 1 -->
  <rect x="76" y="96" width="104" height="320" rx="22" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="92" y="116" width="72" height="16" rx="8" fill="url(#blueGrad)"/>
  <rect x="92" y="152" width="72" height="52" rx="10" fill="#0f172a"/>
  <rect x="92" y="218" width="72" height="52" rx="10" fill="#0f172a"/>
  <rect x="92" y="284" width="72" height="52" rx="10" fill="#0f172a"/>

  <!-- Column 2 -->
  <rect x="204" y="96" width="104" height="320" rx="22" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="220" y="116" width="72" height="16" rx="8" fill="url(#amberGrad)"/>
  <rect x="220" y="152" width="72" height="64" rx="10" fill="#0f172a"/>
  <rect x="220" y="230" width="72" height="64" rx="10" fill="#0f172a"/>

  <!-- Column 3 -->
  <rect x="332" y="96" width="104" height="320" rx="22" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <rect x="348" y="116" width="72" height="16" rx="8" fill="url(#greenGrad)"/>
  <rect x="348" y="152" width="72" height="52" rx="10" fill="#0f172a"/>

  <!-- Floating Checkmark Badge -->
  <circle cx="380" cy="360" r="68" fill="#0f172a" stroke="url(#greenGrad)" stroke-width="8"/>
  <path d="M 348 360 L 370 382 L 414 338" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
