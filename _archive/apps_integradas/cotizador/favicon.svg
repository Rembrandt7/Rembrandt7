<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Emerald-Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Gold Currency Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="96" y1="60" x2="96" y2="452"/>
    <line x1="176" y1="60" x2="176" y2="452"/>
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="336" y1="60" x2="336" y2="452"/>
    <line x1="416" y1="60" x2="416" y2="452"/>
    <line x1="60" y1="96" x2="452" y2="96"/>
    <line x1="60" y1="176" x2="452" y2="176"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <line x1="60" y1="336" x2="452" y2="336"/>
    <line x1="60" y1="416" x2="452" y2="416"/>
  </g>

  <!-- Isometric Architectural Building / Geometry -->
  <g transform="translate(0, -10)">
    <!-- Main Isometric Structure (Left Face) -->
    <path d="M 256 120 L 130 190 L 130 340 L 256 270 Z" fill="#1e293b" opacity="0.9" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Isometric Structure (Right Face) -->
    <path d="M 256 120 L 382 190 L 382 340 L 256 270 Z" fill="#0f172a" opacity="0.95" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Isometric Structure (Top Roof Face) -->
    <path d="M 256 120 L 382 190 L 256 260 L 130 190 Z" fill="url(#accentGrad)" opacity="0.25" stroke="url(#accentGrad)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Architectural Facade Columns / Sections -->
    <line x1="172" y1="213" x2="172" y2="316" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
    <line x1="214" y1="237" x2="214" y2="293" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
    <line x1="298" y1="237" x2="298" y2="293" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>
    <line x1="340" y1="213" x2="340" y2="316" stroke="#38bdf8" stroke-width="3" opacity="0.7"/>

    <!-- Dynamic Architectural Drafting Triangle (Escuadra) Layer -->
    <path d="M 100 370 L 256 450 L 412 370 L 382 355 L 256 420 L 130 355 Z" fill="url(#accentGrad)" opacity="0.85"/>
  </g>

  <!-- Floating Cotizador Badge (Symbolizing Quotation / Financial Value) -->
  <g transform="translate(320, 290)" filter="url(#glow)">
    <circle cx="50" cy="50" r="44" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="50" cy="50" r="38" fill="url(#goldGrad)" opacity="0.15"/>
    <!-- Currency / Dollar Symbol -->
    <text x="50" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">$</text>
  </g>
</svg>
