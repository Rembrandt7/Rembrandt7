<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costeador 3D Pro | Monterrey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .active-btn { background: #2563eb !important; color: white !important; }
        select { color-scheme: dark; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="max-w-6xl w-full glass rounded-[3rem] overflow-hidden shadow-2xl flex flex-col lg:flex-row min-h-[700px]">
        <!-- CALCULATOR -->
        <div class="flex-1 border-r border-white/5 flex flex-col">
            <div class="p-8 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-blue-500/20 rounded-2xl"><i data-lucide="calculator" class="text-blue-400 w-8 h-8"></i></div>
                    <div>
                        <h1 class="text-2xl font-black tracking-tight italic uppercase">Costeador Express</h1>
                        <p class="text-[10px] text-blue-300/60 uppercase tracking-widest font-bold">Monterrey • Consumos Reales</p>
                    </div>
                </div>
                <button onclick="resetValues()" class="p-3 text-gray-500 hover:text-white"><i data-lucide="refresh-cw" class="w-6 h-6"></i></button>
            </div>

            <div class="p-10 space-y-8">
                <div class="flex gap-6">
                    <div class="flex-[2] space-y-2">
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest block ml-1">Nombre Pieza</label>
                        <input type="text" id="pieceName" placeholder="Ej: Casco Iron Man..." oninput="calculate()" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 text-white font-bold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30">
                    </div>
                    <div class="flex-1 space-y-2">
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest block ml-1">Material</label>
                        <select id="material" onchange="calculate()" class="w-full bg-slate-900 border border-white/10 rounded-2xl px-5 py-4 text-white font-bold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500/30">
                            <option value="PLA">PLA (125W)</option>
                            <option value="PETG">PETG (155W)</option>
                            <option value="TPU">TPU (125W)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest block ml-1">Precio ($/kg)</label>
                        <div class="flex items-center bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                            <button onclick="adjustInput('filamentPrice', -50)" class="px-4 py-3 hover:bg-white/10 text-white font-black text-xl">-</button>
                            <input type="number" id="filamentPrice" value="400" oninput="calculate()" class="w-full bg-transparent text-white font-bold text-center focus:outline-none">
                            <button onclick="adjustInput('filamentPrice', 50)" class="px-4 py-3 hover:bg-white/10 text-white font-black text-xl">+</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest block ml-1">Gramos (g)</label>
                        <div class="flex items-center bg-white/5 border border-white/10 rounded-2xl overflow-hidden">
                            <button onclick="adjustInput('weightUsed', -10)" class="px-4 py-3 hover:bg-white/10 text-white font-black text-xl">-</button>
                            <input type="number" id="weightUsed" value="100" oninput="calculate()" class="w-full bg-transparent text-white font-bold text-center focus:outline-none">
                            <button onclick="adjustInput('weightUsed', 10)" class="px-4 py-3 hover:bg-white/10 text-white font-black text-xl">+</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest block ml-1">Tiempo (hh:mm)</label>
                        <div class="flex items-center bg-white/5 border border-white/10 rounded-2xl px-4 py-4 h-full">
                            <input type="number" id="printHours" value="5" oninput="calculate()" class="w-full bg-transparent text-white font-bold text-right focus:outline-none text-xl">
                            <span class="text-gray-600 font-bold mx-1">:</span>
                            <input type="number" id="printMinutes" value="0" oninput="calculateMinutes()" class="w-full bg-transparent text-white font-bold text-left focus:outline-none text-xl">
                        </div>
                    </div>
                </div>

                <!-- Costs -->
                <div class="grid grid-cols-2 gap-6 pt-4">
                    <div class="p-6 bg-yellow-500/5 border border-yellow-500/10 rounded-[2rem] space-y-1">
                        <p class="text-[10px] text-yellow-500 font-black uppercase tracking-widest">Energía (Mi Gasto)</p>
                        <p id="resEnergy" class="text-4xl font-black text-white italic">$0.00</p>
                    </div>
                    <div class="p-6 bg-green-500/5 border border-green-500/10 rounded-[2rem] space-y-1">
                        <p class="text-[10px] text-green-500 font-black uppercase tracking-widest">Filamento (Mi Gasto)</p>
                        <p id="resFilament" class="text-4xl font-black text-white italic">$0.00</p>
                    </div>
                </div>

                <div class="pt-6 border-t border-white/5 space-y-4">
                    <button onclick="addToQueue()" class="w-full flex items-center justify-center gap-4 py-6 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-[2rem] font-black uppercase tracking-[0.3em] text-xs shadow-2xl hover:shadow-blue-500/20 transition-all">
                        <i data-lucide="plus" class="w-6 h-6"></i> Agregar a mi Lote
                    </button>
                </div>
            </div>
        </div>

        <!-- QUEUE -->
        <div class="w-full lg:w-[400px] bg-white/[0.02] flex flex-col">
            <div class="p-8 border-b border-white/10 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i data-lucide="list-checks" class="text-indigo-400 w-6 h-6"></i>
                    <h3 class="text-sm font-black text-white uppercase tracking-widest">Quiero Imprimir</h3>
                </div>
                <div class="text-[10px] text-gray-500 font-bold uppercase italic">Sync: Local</div>
            </div>

            <div id="queueList" class="flex-1 overflow-y-auto p-8 space-y-4 custom-scrollbar">
                <!-- Items inject here -->
            </div>

            <div class="p-10 border-t border-white/10 bg-white/[0.02]">
                <div class="flex justify-between items-center">
                    <span class="text-xs text-gray-500 font-black uppercase tracking-widest">Total Estimado</span>
                    <span id="totalQueue" class="text-2xl font-black text-white">$0.00</span>
                </div>
                <button onclick="window.print()" class="w-full mt-6 py-4 bg-white text-slate-900 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-gray-200 transition-all">Exportar Lote</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let queue = JSON.parse(localStorage.getItem('impresion3d_standalone') || '[]');
        const MATERIAL_POWER = { PLA: 125, PETG: 155, TPU: 125 };

        function formatMXN(val) { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val); }

        function adjustInput(id, amount) {
            const el = document.getElementById(id);
            el.value = Math.max(0, parseInt(el.value || 0) + amount);
            calculate();
        }

        function calculateMinutes() {
            const el = document.getElementById('printMinutes');
            if (el.value > 59) el.value = 59;
            calculate();
        }

        function calculate() {
            const material = document.getElementById('material').value;
            const filamentPrice = parseFloat(document.getElementById('filamentPrice').value) || 0;
            const weightUsed = parseFloat(document.getElementById('weightUsed').value) || 0;
            const printHours = parseFloat(document.getElementById('printHours').value) || 0;
            const printMinutes = parseFloat(document.getElementById('printMinutes').value) || 0;

            const totalHours = printHours + (printMinutes / 60);
            const filamentCost = (filamentPrice / 1000) * weightUsed;
            const energyCost = (MATERIAL_POWER[material] / 1000) * totalHours * 2.5;
            const baseCost = filamentCost + energyCost + (totalHours * 5);
            const commercialPrice = baseCost * 1.30;

            document.getElementById('resEnergy').innerText = formatMXN(energyCost);
            document.getElementById('resFilament').innerText = formatMXN(filamentCost);
            
            window.currentCalc = { 
                name: document.getElementById('pieceName').value || "Pieza " + material,
                material,
                time: printHours + "h " + printMinutes + "m",
                cost: commercialPrice
            };
        }

        function renderQueue() {
            const list = document.getElementById('queueList');
            list.innerHTML = '';
            let total = 0;
            queue.forEach((item, index) => {
                total += item.cost;
                const div = document.createElement('div');
                div.className = "p-5 bg-white/[0.04] border border-white/5 rounded-[2rem] space-y-3 relative";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-xs font-black text-white italic uppercase">${item.name}</h4>
                            <div class="flex gap-2 mt-1">
                                <span class="text-[8px] px-2 py-0.5 bg-blue-500/10 text-blue-400 rounded-full font-black uppercase">${item.material}</span>
                                <span class="text-[8px] px-2 py-0.5 bg-orange-500/10 text-orange-400 rounded-full font-black uppercase">${item.time}</span>
                            </div>
                        </div>
                        <button onclick="removeFromQueue(${index})" class="text-gray-600 hover:text-rose-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-white/5">
                        <span class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">Est. Venta</span>
                        <span class="text-sm font-black text-white">${formatMXN(item.cost)}</span>
                    </div>
                `;
                list.appendChild(div);
            });
            document.getElementById('totalQueue').innerText = formatMXN(total);
            lucide.createIcons();
            localStorage.setItem('impresion3d_standalone', JSON.stringify(queue));
        }

        function addToQueue() {
            queue.push(window.currentCalc);
            renderQueue();
        }

        function removeFromQueue(index) {
            queue.splice(index, 1);
            renderQueue();
        }

        function resetValues() {
            document.getElementById('pieceName').value = "";
            document.getElementById('filamentPrice').value = 400;
            document.getElementById('weightUsed').value = 100;
            calculate();
        }

        calculate();
        renderQueue();
    </script>
</body>
</html>
