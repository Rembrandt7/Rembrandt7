<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costeador 3D Pro | Monterrey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .active-btn { background: #2563eb !important; color: white !important; }
        input[type="number"] { background: transparent; }
    </style>
</head>
<body>
    <div class="max-w-4xl w-full glass rounded-[2rem] overflow-hidden shadow-2xl animate-in fade-in duration-500">
        <!-- Header -->
        <div class="px-6 py-4 border-b border-white/10 bg-white/[0.02] flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="calculator" class="text-blue-400 w-5 h-5"></i>
                <h1 class="text-xs font-black tracking-[0.2em] uppercase italic">Calculadora Express 3D</h1>
            </div>
            <button onclick="resetValues()" class="text-gray-500 hover:text-white transition-all"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2">
            <!-- Inputs -->
            <div class="p-8 space-y-6 border-r border-white/5">
                
                <!-- Row 1 -->
                <div class="flex gap-4">
                    <div class="flex-[2] space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Nombre de la Pieza</label>
                        <input type="text" id="pieceName" placeholder="Ej: Casco..." oninput="calculate()" class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-white text-sm focus:outline-none focus:ring-1 focus:ring-blue-500/50">
                    </div>
                    <div class="flex-1 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Material</label>
                        <select id="material" onchange="calculate()" class="w-full bg-white/5 border border-white/10 rounded-xl px-2 py-2 text-white text-sm focus:outline-none">
                            <option value="PLA">PLA</option>
                            <option value="PETG">PETG</option>
                            <option value="TPU">TPU</option>
                        </select>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="flex gap-3">
                    <div class="w-20 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Filamento</label>
                        <input type="number" id="filamentPrice" value="400" oninput="calculate()" class="w-full bg-white/5 border border-white/10 rounded-xl px-2 py-2 text-white text-sm text-center focus:outline-none">
                    </div>
                    <div class="w-24 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Gramos</label>
                        <input type="number" id="weightUsed" value="100" oninput="calculate()" class="w-full bg-white/5 border border-white/10 rounded-xl px-2 py-2 text-white text-sm text-center focus:outline-none">
                    </div>
                    <div class="flex-1 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Tiempo (hh:mm)</label>
                        <div class="flex items-center bg-white/5 border border-white/10 rounded-xl px-2 py-2">
                            <input type="number" id="printHours" value="5" oninput="calculate()" class="w-full text-white text-sm text-right focus:outline-none pr-1">
                            <span class="text-gray-600">:</span>
                            <input type="number" id="printMinutes" value="0" oninput="calculateMinutes()" class="w-full text-white text-sm text-left focus:outline-none pl-1">
                        </div>
                    </div>
                </div>

                <!-- Row 3 -->
                <div class="flex gap-4">
                    <div class="flex-1 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Labor (+/- 10)</label>
                        <div class="flex items-center bg-white/5 border border-white/10 rounded-xl overflow-hidden">
                            <button onclick="adjustLabor(-10)" class="px-3 py-2 hover:bg-white/5 text-gray-400 text-lg">-</button>
                            <input type="number" id="laborManual" value="0" oninput="calculate()" class="w-full text-white text-sm text-center focus:outline-none">
                            <button onclick="adjustLabor(10)" class="px-3 py-2 hover:bg-white/5 text-gray-400 text-lg">+</button>
                        </div>
                    </div>
                    <div class="flex-1 space-y-1.5">
                        <label class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Margen (%)</label>
                        <div class="grid grid-cols-3 gap-1 p-1 bg-white/5 rounded-xl">
                            <button onclick="setMarkup(15)" id="m-15" class="py-1 text-[10px] font-black rounded-lg transition-all text-gray-500">15%</button>
                            <button onclick="setMarkup(20)" id="m-20" class="py-1 text-[10px] font-black rounded-lg transition-all text-gray-500">20%</button>
                            <button onclick="setMarkup(30)" id="m-30" class="py-1 text-[10px] font-black rounded-lg transition-all active-btn text-white">30%</button>
                        </div>
                    </div>
                </div>

                <!-- My Costs -->
                <div class="pt-6 mt-6 border-t border-white/5 space-y-3">
                    <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
                        <span class="text-gray-500">Consumo Luz (Mty)</span>
                        <span id="resEnergy" class="text-yellow-400 font-mono font-black">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] font-bold uppercase tracking-widest">
                        <span class="text-gray-500">Costo Filamento</span>
                        <span id="resFilament" class="text-green-400 font-mono font-black">$0.00</span>
                    </div>
                    <div class="flex justify-between items-center p-3 bg-blue-600/10 rounded-xl border border-blue-500/20">
                        <span class="text-blue-400 text-xs font-black uppercase italic tracking-tighter">Mi Costo Base</span>
                        <span id="resBase" class="text-white font-black text-lg">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Strategy -->
            <div class="p-10 bg-white/[0.02] flex flex-col justify-center space-y-10">
                
                <div class="space-y-8">
                    <!-- Friend -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <span class="text-[10px] font-black text-green-500 uppercase tracking-widest">Precio Amigo</span>
                            <span id="resFriend" class="text-3xl font-black text-white leading-none">$0.00</span>
                        </div>
                        <button onclick="copySalesText('amigo')" class="w-full flex items-center justify-center gap-2 py-2.5 bg-green-500/10 hover:bg-green-500/20 text-green-500 rounded-xl text-[9px] font-black uppercase tracking-widest border border-green-500/20 transition-all">
                            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copiar Cotización
                        </button>
                    </div>

                    <!-- Commercial -->
                    <div class="space-y-4 pt-6 border-t border-white/5">
                        <div class="flex justify-between items-end">
                            <div>
                                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest block mb-1">Precio Comercial</span>
                                <span id="resCommercial" class="text-6xl font-black text-white tracking-tighter leading-none">$0.00</span>
                            </div>
                        </div>
                        <button onclick="copySalesText('comercial')" class="w-full flex items-center justify-center gap-2 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-blue-900/40 transition-all">
                            <i data-lucide="copy" class="w-5 h-5"></i> Copiar Texto de Venta
                        </button>
                    </div>
                </div>
                <p class="text-[8px] text-center text-gray-700 font-bold uppercase tracking-[0.4em]">Rembrandt Studio Monterrey</p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let currentMarkup = 30;
        const MATERIAL_POWER = { PLA: 125, PETG: 155, TPU: 125 };

        function formatMXN(val) { return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val); }

        function adjustLabor(amount) {
            const el = document.getElementById('laborManual');
            el.value = Math.max(0, parseInt(el.value || 0) + amount);
            calculate();
        }

        function calculateMinutes() {
            const el = document.getElementById('printMinutes');
            if (el.value > 59) el.value = 59;
            calculate();
        }

        function setMarkup(m) {
            currentMarkup = m;
            [15, 20, 30].forEach(v => {
                document.getElementById('m-' + v).className = v === m ? "py-1 text-[10px] font-black rounded-lg transition-all active-btn text-white" : "py-1 text-[10px] font-black rounded-lg transition-all text-gray-500";
            });
            calculate();
        }

        function calculate() {
            const name = document.getElementById('pieceName').value;
            const material = document.getElementById('material').value;
            const filamentPrice = parseFloat(document.getElementById('filamentPrice').value) || 0;
            const weightUsed = parseFloat(document.getElementById('weightUsed').value) || 0;
            const printHours = parseFloat(document.getElementById('printHours').value) || 0;
            const printMinutes = parseFloat(document.getElementById('printMinutes').value) || 0;
            const laborManual = parseFloat(document.getElementById('laborManual').value) || 0;

            const totalHours = printHours + (printMinutes / 60);
            const filamentCost = (filamentPrice / 1000) * weightUsed;
            const energyCost = (MATERIAL_POWER[material] / 1000) * totalHours * 2.5;
            const maintenanceCost = totalHours * 5;
            
            const baseCost = filamentCost + energyCost + maintenanceCost + laborManual;
            const friendPrice = baseCost * 1.15;
            const commercialPrice = baseCost * (1 + currentMarkup / 100);

            document.getElementById('resEnergy').innerText = formatMXN(energyCost);
            document.getElementById('resFilament').innerText = formatMXN(filamentCost);
            document.getElementById('resBase').innerText = formatMXN(baseCost);
            document.getElementById('resFriend').innerText = formatMXN(friendPrice);
            document.getElementById('resCommercial').innerText = formatMXN(commercialPrice);
            
            window.lastData = { name, material, hours: printHours, minutes: printMinutes, friend: friendPrice, commercial: commercialPrice };
        }

        function copySalesText(type) {
            const d = window.lastData;
            const name = d.name.trim() || ("Pieza de " + d.material);
            const time = `${d.hours}h ${d.minutes}m`;
            const price = formatMXN(d[type]);
            
            let text = "";
            if (type === 'amigo') {
                text = `¡Qué onda! Te paso la cotización de tu ${name}: El costo neto por los materiales, energía y el tiempo de impresión (${time}) queda en ${price}. ¡Es precio especial! Quedo a tus órdenes.`;
            } else {
                text = `¡Hola! Con gusto te comparto la cotización de tu ${name}. Realizada en material ${d.material} con un tiempo de impresión de ${time}, el total sería de ${price}. ¡Quedo a tus órdenes para iniciar tu proyecto!`;
            }
            
            navigator.clipboard.writeText(text).then(() => {
                alert("¡Copiado!");
            });
        }

        function resetValues() {
            document.getElementById('pieceName').value = "";
            document.getElementById('filamentPrice').value = 400;
            document.getElementById('weightUsed').value = 100;
            document.getElementById('laborManual').value = 0;
            setMarkup(30);
            calculate();
        }

        calculate();
    </script>
</body>
</html>
